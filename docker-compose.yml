services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webnexus
      POSTGRES_PASSWORD: webnexus
      POSTGRES_DB: webnexus
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webnexus -d webnexus"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
